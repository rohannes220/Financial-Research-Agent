<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Research Agent</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui;background:#0b1020;color:#eef2ff}
body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}
h1{font-size:42px;margin:0 0 8px}.muted{color:#aab3d0}.card{background:#121a30;border:1px solid #273253;border-radius:18px;padding:20px;margin-top:20px}
.row{display:grid;grid-template-columns:180px 1fr 130px;gap:12px}
input,select,button{border-radius:10px;border:1px solid #34405f;padding:13px;font-size:15px}
input,select{background:#0d1428;color:white}button{background:#eef2ff;color:#10162a;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#263250;margin-right:8px}
pre{white-space:pre-wrap;font-family:inherit;line-height:1.55}.source{padding:12px 0;border-top:1px solid #273253}.fact{display:flex;justify-content:space-between;border-top:1px solid #273253;padding:9px 0;gap:12px}
a{color:#b8c8ff}.hidden{display:none}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}h1{font-size:32px}}
</style></head>
<body><div class="wrap">
<div class="hero"><div><div class="muted">AI + SEC EDGAR + PostgreSQL</div><h1>Financial Research Agent</h1>
<div class="muted">Ask grounded questions across filings and structured XBRL facts.</div></div></div>
<div class="card"><div class="row">
<select id="ticker"><option value="MSFT">Microsoft (MSFT)</option></select>
<input id="question" value="Why did revenue change and what did management say drove it?" placeholder="Research question">
<button onclick="ask()">Research</button>
</div><div id="status" class="muted" style="margin-top:12px">Ready.</div></div>
<div id="results" class="grid hidden">
<div class="card"><div><span id="route" class="pill"></span><span id="latency" class="muted"></span></div>
<h2>Research answer</h2><pre id="answer"></pre><h3>Filing evidence</h3><div id="sources"></div></div>
<div class="card"><h2>Structured facts</h2><div id="facts"></div></div>
</div></div>
<script>
function money(v,u){if(u==="USD"){let a=Math.abs(v);if(a>=1e9)return "$"+(v/1e9).toFixed(2)+"B";if(a>=1e6)return "$"+(v/1e6).toFixed(2)+"M"}return Number(v).toLocaleString()+" "+u}

async function loadCompanies(){
 try{
  const r=await fetch("/companies");
  const companies=await r.json();
  const select=document.getElementById("ticker");

  if(Array.isArray(companies) && companies.length){
   select.innerHTML=companies.map(
    c=>`<option value="${c.ticker}">${c.name||c.ticker} (${c.ticker})</option>`
   ).join("");

   if(companies.some(c=>c.ticker==="MSFT")){
    select.value="MSFT";
   }
  }
 }catch(e){
  console.warn("Could not load companies",e);
 }
}

loadCompanies();

async function ask(){
 const status=document.getElementById("status");status.textContent="Researching filings and financial facts…";
 const payload={ticker:document.getElementById("ticker").value,question:document.getElementById("question").value};
 try{
  const r=await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const d=await r.json(); if(!r.ok) throw new Error(d.detail||"Request failed");
  document.getElementById("results").classList.remove("hidden"); document.getElementById("route").textContent=d.route.toUpperCase();
  document.getElementById("latency").textContent=d.latency_ms+" ms";document.getElementById("answer").textContent=d.answer;
  document.getElementById("sources").innerHTML=d.citations.map(x=>`<div class="source"><b>[${x.source_id}] ${x.form}</b> · ${x.section||'other'} · ${x.filed_at}<br><span class="muted">${x.excerpt}</span><br><a target="_blank" href="${x.source_url}">Open SEC filing</a></div>`).join("")||'<span class="muted">No filing passages used.</span>';
  document.getElementById("facts").innerHTML=d.facts_used.map(x=>`<div class="fact"><span>${x.label||x.concept}<br><small class="muted">${x.end}</small></span><b>${money(x.value,x.unit)}</b></div>`).join("")||'<span class="muted">No structured facts used.</span>';
  status.textContent="Complete.";
 }catch(e){status.textContent=e.message}
}
</script></body></html>
